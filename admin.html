<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড - কাজকরি</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white shadow-sm py-4 px-6 md:px-12 flex justify-between items-center border-b">
        <a href="index.html" class="text-2xl font-bold text-blue-600 tracking-wide">
            🛠️ কাজ<span class="text-emerald-500">করি</span> <span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded ml-1">Admin</span>
        </a>
        <a href="index.html" class="px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100 transition text-sm font-semibold">
            ← হোমপেজে ফিরুন
        </a>
    </nav>

    <main class="max-w-6xl mx-auto my-8 p-4 md:p-6">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-6">অ্যাডমিন কন্ট্রোল প্যানেল</h1>

        <!-- বুকিং তালিকা সেকশন -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                📋 গ্রাহকদের বুকিং রিকোয়েস্ট তালিকা
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-gray-50 text-gray-600 text-sm">
                            <th class="p-3">তারিখ</th>
                            <th class="p-3">গ্রাহকের নাম</th>
                            <th class="p-3">মোবাইল</th>
                            <th class="p-3">ঠিকানা</th>
                            <th class="p-3">কারিগর</th>
                            <th class="p-3">স্ট্যাটাস</th>
                            <th class="p-3">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="bookingTableBody" class="text-sm divide-y"></tbody>
                </table>
            </div>
        </section>

        <!-- রেজিস্টার্ড শ্রমিক সেকশন -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                👷 নিবন্ধিত শ্রমিকদের তালিকা
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-gray-50 text-gray-600 text-sm">
                            <th class="p-3">নাম</th>
                            <th class="p-3">ক্যাটাগরি</th>
                            <th class="p-3">এলাকা</th>
                            <th class="p-3">মোবাইল</th>
                            <th class="p-3">চার্জ</th>
                            <th class="p-3">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="workerTableBody" class="text-sm divide-y"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXD9-SYaqnmatYe81M9wBeSB4wjJGFAZQ",
            authDomain: "kajkori-8a07e.firebaseapp.com",
            projectId: "kajkori-8a07e",
            storageBucket: "kajkori-8a07e.firebasestorage.app",
            messagingSenderId: "594029245687",
            appId: "1:594029245687:web:d2364820ce6be9d4104ff2",
            measurementId: "G-K4NH7TW7D9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function loadBookings() {
            db.collection("bookings").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                const tbody = document.getElementById('bookingTableBody');
                if (!tbody) return;

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-400">কোনো বুকিং পাওয়া যায়নি</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                snapshot.forEach((doc) => {
                    const b = doc.data();
                    let formattedTime = 'প্রসেসিং...';

                    if (b.createdAt) {
                        const dateObj = b.createdAt.toDate();
                        formattedTime = dateObj.toLocaleString('bn-BD', {
                            day: 'numeric',
                            month: 'short',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit',
                            hour12: true
                        });
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 text-xs font-bold text-gray-600">${formattedTime}</td>
                            <td class="p-3 font-semibold">${b.customerName || '-'}</td>
                            <td class="p-3"><a href="tel:${b.customerPhone}" class="text-blue-600 underline">${b.customerPhone || '-'}</a></td>
                            <td class="p-3 text-gray-600">${b.customerAddress || '-'}</td>
                            <td class="p-3 font-medium text-emerald-600">${b.workerName || '-'}</td>
                            <td class="p-3"><span class="bg-amber-100 text-amber-700 px-2 py-1 rounded-md text-xs font-semibold">${b.status || 'পেন্ডিং'}</span></td>
                            <td class="p-3">
                                <button onclick="deleteBooking('${doc.id}')" class="text-red-500 hover:text-red-700 font-semibold text-xs border border-red-200 px-2.5 py-1 rounded-lg hover:bg-red-50">মুছে ফেলুন</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function deleteBooking(id) {
            if (confirm('আপনি কি এই বুকিংটি মুছে ফেলতে চান?')) {
                db.collection("bookings").doc(id).delete()
                    .then(() => alert('বুকিংটি সফলভাবে মুছে ফেলা হয়েছে!'))
                    .catch((err) => alert('সমস্যা হয়েছে: ' + err.message));
            }
        }

        function loadWorkers() {
            db.collection("workers").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                const tbody = document.getElementById('workerTableBody');
                if (!tbody) return;

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">কোনো নিবন্ধিত শ্রমিক পাওয়া যায়নি</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                snapshot.forEach((doc) => {
                    const w = doc.data();
                    const img = w.image || 'https://via.placeholder.com/40';

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 border-b">
                            <td class="p-3 font-semibold text-gray-800">${w.name || '-'}</td>
                            <td class="p-3">
                                <div class="flex items-center gap-2">
                                    <img src="${img}" class="w-8 h-8 rounded-full object-cover border" onerror="this.src='https://via.placeholder.com/40'">
                                    <span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded font-medium">${w.category || '-'}</span>
                                </div>
                            </td>
                            <td class="p-3 text-gray-600">${w.area || '-'}</td>
                            <td class="p-3"><a href="tel:${w.phone}" class="text-blue-600 underline text-sm">${w.phone || '-'}</a></td>
                            <td class="p-3 font-bold text-emerald-600">৳${w.charge || '-'}</td>
                            <td class="p-3">
                                <button onclick="deleteWorker('${doc.id}')" class="text-red-500 hover:text-red-700 font-semibold text-xs border border-red-200 px-2.5 py-1 rounded-lg hover:bg-red-50">মুছে ফেলুন</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function deleteWorker(id) {
            if (confirm('আপনি কি এই শ্রমিককে তালিকা থেকে মুছে ফেলতে চান?')) {
                db.collection("workers").doc(id).delete()
                    .then(() => alert('শ্রমিকটি সফলভাবে মুছে ফেলা হয়েছে!'))
                    .catch((err) => alert('সমস্যা হয়েছে: ' + err.message));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBookings();
            loadWorkers();
        });
    </script>
</body>
</html>
