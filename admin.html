<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড - কাজকরি</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <nav class="bg-white shadow-sm py-4 px-6 md:px-12 flex justify-between items-center border-b">
        <a href="index.html" class="text-2xl font-bold text-blue-600 tracking-wide">
            🛠️ কাজ<span class="text-emerald-500">করি</span> <span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded ml-1">Admin</span>
        </a>
        <div class="flex items-center gap-2">
            <a href="index.html" class="px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100 transition text-sm font-semibold">
                ← হোমপেজে ফিরুন
            </a>
            <button onclick="logoutAdmin()" class="bg-red-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-red-600">লগআউট</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto my-8 p-4 md:p-6">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-6">অ্যাডমিন কন্ট্রোল প্যানেল</h1>

        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                📋 গ্রাহকদের বুকিং রিকোয়েস্ট তালিকা
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-gray-50 text-gray-600 text-sm">
                            <th class="p-3">তারিখ</th>
                            <th class="p-3">গ্রাহকের নাম</th>
                            <th class="p-3">মোবাইল</th>
                            <th class="p-3">ঠিকানা</th>
                            <th class="p-3">কারিগর</th>
                            <th class="p-3">স্ট্যাটাস</th>
                            <th class="p-3">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="bookingTableBody" class="text-sm divide-y"></tbody>
                </table>
            </div>
        </section>

        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                👷 নিবন্ধিত শ্রমিকদের তালিকা
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-gray-50 text-gray-600 text-sm">
                            <th class="p-3">নাম</th>
                            <th class="p-3">ক্যাটাগরি</th>
                            <th class="p-3">এলাকা</th>
                            <th class="p-3">মোবাইল</th>
                            <th class="p-3">চার্জ</th>
                            <th class="p-3">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="workerTableBody" class="text-sm divide-y"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXD9-SYAqnmatYe81M9wBeSB4wjJGFAZQ",
            authDomain: "kajkori-8a07e.firebaseapp.com",
            databaseURL: "https://kajkori-8a07e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kajkori-8a07e",
            storageBucket: "kajkori-8a07e.firebasestorage.app",
            messagingSenderId: "594029245687",
            appId: "1:594029245687:web:d2364820ce6be9d4104ff2",
            measurementId: "G-K4NH7TW7D9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 🛡️ অ্যাডমিন ইমেইল সিকিউরিটি ভেরিফিকেশন
        const ADMIN_EMAIL = "admin@kajkori.com";

        auth.onAuthStateChanged((user) => {
            if (!user) {
                // ১. ইউজার লগইন না করা থাকলে লগইন পেজে পাঠাবে
                window.location.href = "login.html";
            } else if (!user.email || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                // ২. অন্য কোনো সাধারণ ইউজার হলে সাথে সাথে ব্লক করে হোমপেজে পাঠাবে
                alert("❌ আপনার এই অ্যাডমিন প্যানেলে প্রবেশ করার কোনো অনুমতি নেই!");
                auth.signOut().then(() => {
                    window.location.href = "index.html";
                });
            } else {
                // ৩. শুধুমাত্র admin@kajkori.com হলেই ডাটা লোড হবে
                loadBookings();
                loadWorkers();
            }
        });

        function logoutAdmin() {
            auth.signOut().then(() => {
                window.location.href = "login.html";
            });
        }

        function loadBookings() {
            db.collection("bookings").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                const tbody = document.getElementById('bookingTableBody');
                if (!tbody) return;

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-400">কোনো বুকিং রিকোয়েস্ট নেই</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                snapshot.forEach((doc) => {
                    const b = doc.data();
                    const id = doc.id;

                    let timeStr = 'সময় পাওয়া যায়নি';
                    if (b.createdAt && b.createdAt.toDate) {
                        timeStr = b.createdAt.toDate().toLocaleString('bn-BD', {
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit',
                            hour12: true
                        });
                    }

                    let statusBadge = '';
                    let actionButtons = '';

                    if (b.status === 'Accepted') {
                        statusBadge = `<span class="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-xs font-bold">গৃহীত</span>`;
                        actionButtons = `<button onclick="changeStatus('${id}', 'Completed')" class="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600">সম্পন্ন করুন</button>`;
                    } else if (b.status === 'Completed') {
                        statusBadge = `<span class="bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full text-xs font-bold">সম্পন্ন</span>`;
                        actionButtons = `<span class="text-xs text-gray-400">কাজ শেষ</span>`;
                    } else if (b.status === 'Cancelled') {
                        statusBadge = `<span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-full text-xs font-bold">বাতিল</span>`;
                        actionButtons = `<span class="text-xs text-gray-400">বাতিল করা হয়েছে</span>`;
                    } else {
                        statusBadge = `<span class="bg-yellow-100 text-yellow-800 px-2.5 py-1 rounded-full text-xs font-bold">পেন্ডিং</span>`;
                        actionButtons = `
                            <button onclick="changeStatus('${id}', 'Accepted')" class="bg-green-600 text-white px-2 py-1 rounded text-xs hover:bg-green-700 mr-1">একসেপ্ট</button>
                            <button onclick="changeStatus('${id}', 'Cancelled')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">বাতিল</button>
                        `;
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 border-b text-sm">
                            <td class="p-3 text-gray-500 text-xs">${timeStr}</td>
                            <td class="p-3 font-semibold text-gray-800">${b.customerName || '-'}</td>
                            <td class="p-3"><a href="tel:${b.customerPhone}" class="text-blue-600 underline">${b.customerPhone || '-'}</a></td>
                            <td class="p-3 text-gray-600">${b.customerAddress || '-'}</td>
                            <td class="p-3 font-medium text-emerald-600">${b.workerName || '-'}</td>
                            <td class="p-3">${statusBadge}</td>
                            <td class="p-3">${actionButtons}</td>
                        </tr>
                    `;
                });
            });
        }

        function changeStatus(bookingId, newStatus) {
            db.collection("bookings").doc(bookingId).update({
                status: newStatus
            })
            .then(() => {
                console.log("Status updated to: " + newStatus);
            })
            .catch((error) => {
                alert("সমস্যা হয়েছে: " + error.message);
            });
        }

        function deleteBooking(id) {
            if (confirm('আপনি কি এই বুকিংটি মুছে ফেলতে চান?')) {
                db.collection("bookings").doc(id).delete()
                    .then(() => alert('বুকিংটি সফলভাবে মুছে ফেলা হয়েছে!'))
                    .catch((err) => alert('সমস্যা হয়েছে: ' + err.message));
            }
        }

        function loadWorkers() {
            db.collection("workers").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                const tbody = document.getElementById('workerTableBody');
                if (!tbody) return;

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">কোনো নিবন্ধিত শ্রমিক পাওয়া যায়নি</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                snapshot.forEach((doc) => {
                    const w = doc.data();
                    const img = w.image || 'https://via.placeholder.com/40';

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 border-b">
                            <td class="p-3 font-semibold text-gray-800">${w.name || '-'}</td>
                            <td class="p-3">
                                <div class="flex items-center gap-2">
                                    <img src="${img}" class="w-8 h-8 rounded-full object-cover border" onerror="this.src='https://via.placeholder.com/40'">
                                    <span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded font-medium">${w.category || '-'}</span>
                                </div>
                            </td>
                            <td class="p-3 text-gray-600">${w.area || '-'}</td>
                            <td class="p-3"><a href="tel:${w.phone}" class="text-blue-600 underline text-sm">${w.phone || '-'}</a></td>
                            <td class="p-3 font-bold text-emerald-600">৳${w.charge || '-'}</td>
                            <td class="p-3">
                                <button onclick="deleteWorker('${doc.id}')" class="text-red-500 hover:text-red-700 font-semibold text-xs border border-red-200 px-2.5 py-1 rounded-lg hover:bg-red-50">মুছে ফেলুন</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function deleteWorker(id) {
            if (confirm('আপনি কি এই শ্রমিককে তালিকা থেকে মুছে ফেলতে চান?')) {
                db.collection("workers").doc(id).delete()
                    .then(() => alert('শ্রমিকটি সফলভাবে মুছে ফেলা হয়েছে!'))
                    .catch((err) => alert('সমস্যা হয়েছে: ' + err.message));
            }
        }
    </script>
</body>
</html>
