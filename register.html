<!DOCTYPE html>
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শ্রমিক রেজিস্ট্রেশন - কাজকরি</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXD9-SYaqnmatYe81M9wBeSB4wjJGFAZQ",
            authDomain: "kajkori-8a07e.firebaseapp.com",
            projectId: "kajkori-8a07e",
            storageBucket: "kajkori-8a07e.firebasestorage.app",
            messagingSenderId: "594029245687",
            appId: "1:594029245687:web:d2364820ce6be9d4104ff2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <nav class="bg-white shadow-sm py-4 px-6 md:px-12 flex justify-between items-center border-b">
        <a href="index.html" class="text-2xl font-bold text-blue-600 tracking-wide">
            🛠️ কাজ<span class="text-emerald-500">করি</span>
        </a>
        <a href="index.html" class="px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100 transition text-sm font-semibold">
            ← হোমপেজে ফিরুন
        </a>
    </nav>

    <main class="max-w-xl mx-auto my-10 p-6 bg-white rounded-2xl shadow-lg border border-gray-100 w-full">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">শ্রমিক হিসেবে নিবন্ধন করুন</h2>
            <p class="text-gray-500 text-sm mt-1">আপনার কাজের তথ্য দিয়ে বিনামূল্যে যুক্ত হন</p>
        </div>

        <form id="workerRegisterForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">আপনার নাম</label>
                <input type="text" id="workerName" placeholder="যেমন: আব্দুল করিম" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border focus:outline-none focus:border-blue-500 text-sm" required>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">কাজের ক্যাটাগরি</label>
                <select id="workerCategory" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border focus:outline-none focus:border-blue-500 text-sm" required>
                    <option value="">ক্যাটাগরি নির্বাচন করুন</option>
                    <option value="⚡ ইলেকট্রিশিয়ান">⚡ ইলেকট্রিশিয়ান</option>
                    <option value="🚰 প্লাম্বার">🚰 প্লাম্বার</option>
                    <option value="🎨 রং মিস্ত্রি">🎨 রং মিস্ত্রি</option>
                    <option value="🔨 কাঠ মিস্ত্রি">🔨 কাঠ মিস্ত্রি</option>
                    <option value="🔧 মেকানিক">🔧 মেকানিক</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">এলাকা / ঠিকানা</label>
                <input type="text" id="workerArea" placeholder="যেমন: মিরপুর-১০, ঢাকা" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border focus:outline-none focus:border-blue-500 text-sm" required>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">সার্ভিস চার্জ (টাকা)</label>
                    <input type="number" id="workerCharge" placeholder="যেমন: ৫০০" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border focus:outline-none focus:border-blue-500 text-sm" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">মোবাইল নম্বর</label>
                    <input type="tel" id="workerPhone" placeholder="017XXXXXXXX" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border focus:outline-none focus:border-blue-500 text-sm" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">শ্রমিকের ছবি</label>
                <input type="file" id="workerImage" accept="image/*" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border focus:outline-none focus:border-blue-500 text-sm" required>
            </div>

            <button type="submit" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                নিবন্ধন সম্পন্ন করুন
            </button>
        </form>
    </main>

    <footer class="text-center py-4 text-xs text-gray-400">
        © 2026 কাজকরি - সর্বস্বত্ব সংরক্ষিত।
    </footer>

    <script>
        document.getElementById('workerRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('workerName').value;
            const category = document.getElementById('workerCategory').value;
            const area = document.getElementById('workerArea').value;
            const phone = document.getElementById('workerPhone').value;
            const charge = document.getElementById('workerCharge').value;
            const imageFile = document.getElementById('workerImage').files[0];

            if (!imageFile) {
                alert("অনুগ্রহ করে শ্রমিকের একটি ছবি নির্বাচন করুন!");
                return;
            }

            const reader = new FileReader();
            reader.readAsDataURL(imageFile);
            reader.onload = function() {
                const imageData = reader.result;

                db.collection("workers").add({
                    name: name,
                    category: category,
                    area: area,
                    phone: phone,
                    charge: charge,
                    image: imageData,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                })
                .then(() => {
                    alert("🎉 শ্রমিক সফলভাবে নিবন্ধিত হয়েছেন!");
                    window.location.href = "index.html";
                })
                .catch((err) => {
                    alert("সমস্যা হয়েছে: " + err.message);
                });
            };
        });
    </script>
</body>
</html>
