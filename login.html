<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - কাজকরি</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">🛠️ কাজকরি-তে স্বাগতম</h1>
        <p class="text-sm text-gray-500 mb-6">সহজেই লগইন করুন এবং আপনার এলাকার শ্রমিক খুঁজুন</p>

        <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 py-3 rounded-xl font-semibold shadow-sm hover:bg-gray-50 transition mb-4">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
            গুগল (Google) দিয়ে প্রবেশ করুন
        </button>

        <div class="relative my-4">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
            <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-400">অথবা ইমেইল দিয়ে</span></div>
        </div>

        <form id="loginForm" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">ইমেইল</label>
                <input type="email" id="userEmail" placeholder="yourname@gmail.com" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">পাসওয়ার্ড</label>
                <input type="password" id="userPassword" placeholder="••••••••" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">লগইন / রেজিস্টার</button>
        </form>

        <a href="index.html" class="inline-block mt-6 text-sm text-gray-500 hover:underline">← হোমপেজে ফিরে যান</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXD9-SYAqnmatYe81M9wBeSB4wjJGFAZQ",
            authDomain: "kajkori-8a07e.firebaseapp.com",
            databaseURL: "https://kajkori-8a07e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kajkori-8a07e",
            storageBucket: "kajkori-8a07e.firebasestorage.app",
            messagingSenderId: "594029245687",
            appId: "1:594029245687:web:d2364820ce6be9d4104ff2",
            measurementId: "G-K4NH7TW7D9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    alert("🎉 স্বাগতম " + (result.user.displayName || 'ইউজার') + "!");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("❌ গুগল লগইনে সমস্যা: " + error.message);
                });
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value;

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.href = "index.html";
                })
                .catch(() => {
                    auth.createUserWithEmailAndPassword(email, password)
                        .then(() => {
                            alert("🎉 আপনার অ্যাকাউন্ট তৈরি হয়ে গেছে!");
                            window.location.href = "index.html";
                        })
                        .catch((err) => alert("❌ সমস্যা: " + err.message));
                });
        });
    </script>
</body>
</html>
