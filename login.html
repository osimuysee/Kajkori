<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন লগইন - কাজকরি</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">🛠️ কাজকরি অ্যাডমিন</h1>
            <p class="text-sm text-gray-500 mt-1">প্যানেলে প্রবেশ করতে ইমেইল ও পাসওয়ার্ড দিন</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ইমেইল</label>
                <input type="email" id="adminEmail" placeholder="admin@example.com" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">পাসওয়ার্ড</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">লগইন করুন</button>
        </form>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXD9-SYaqnmatYe81M9wBeSB4wjJGFAZQ",
            authDomain: "kajkori-8a07e.firebaseapp.com",
            projectId: "kajkori-8a07e",
            storageBucket: "kajkori-8a07e.firebasestorage.app",
            messagingSenderId: "594029245687",
            appId: "1:594029245687:web:d2364820ce6be9d4104ff2"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // লগইন ফর্ম সাবমিট
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert('🎉 লগইন সফল হয়েছে!');
                    window.location.href = "admin.html";
                })
                .catch((error) => {
                    alert('❌ ভুল ইমেইল বা পাসওয়ার্ড! আবার চেষ্টা করুন।');
                });
        });
    </script>
</body>
</html>
